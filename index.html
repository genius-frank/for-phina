<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>For Phina ❤️</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top left, #ff758c, #ff7eb3, #6a0572);
      font-family: 'Poppins', sans-serif;
      color: #fff;
      overflow: hidden;
      padding: 20px;
      transition: background 0.6s ease;
    }

    body.danger-mode {
      background: radial-gradient(circle, #3a0000, #120000);
    }

    .card {
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 28px;
      padding: 36px 26px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      position: relative;
      z-index: 10;
      transition: transform 0.3s ease;
    }

    .shake {
      animation: shake 0.45s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
      40%, 60% { transform: translate3d(7px, 0, 0); }
    }

    .heart-icon {
      font-size: 3.6rem;
      margin-bottom: 10px;
      display: inline-block;
      animation: heartbeat 1.4s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.18); }
      50% { transform: scale(1); }
      75% { transform: scale(1.12); }
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      margin-bottom: 12px;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
    }

    p.subtitle {
      font-size: 1.05rem;
      line-height: 1.5;
      margin-bottom: 24px;
      color: #ffeaf0;
    }

    .warning-box {
      display: none;
      background: rgba(255, 23, 68, 0.28);
      border: 1px solid #ff5252;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 22px;
      font-size: 0.92rem;
      line-height: 1.45;
      color: #ffe0e0;
      font-weight: 600;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 50px;
      padding: 14px 30px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: 'Poppins', sans-serif;
    }

    #yesBtn {
      background: linear-gradient(135deg, #ff2e63, #ff0844);
      color: #fff;
      box-shadow: 0 8px 25px rgba(255, 8, 68, 0.45);
    }

    #yesBtn:hover {
      transform: scale(1.06);
    }

    #noBtn {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .flower {
      position: fixed;
      top: -50px;
      font-size: 2rem;
      pointer-events: none;
      z-index: 5;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <div class="heart-icon" id="topIcon">💖</div>
    <h1 id="titleText">Hey Phina...</h1>
    <p class="subtitle" id="messageText">
      Missing you way too much while you're away.<br>
      Quick security check before your phone continues working:<br><br>
      <strong>Do you love me?</strong>
    </p>

    <div class="warning-box" id="warningBox"></div>

    <div class="btn-group" id="btnGroup">
      <button id="yesBtn">Yes, I do! ❤️</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const warningBox = document.getElementById('warningBox');
    const mainCard = document.getElementById('mainCard');
    const titleText = document.getElementById('titleText');
    const messageText = document.getElementById('messageText');
    const topIcon = document.getElementById('topIcon');
    const btnGroup = document.getElementById('btnGroup');

    let noAttempts = 0;
    let yesScale = 1;

    const threats = [
      "⚠️ SYSTEM ERROR (1/3): Excuse me Phina?! Finger slipped? Initiating phone self-destruct & deleting your best selfies in 3... 2...",
      "🚨 CRITICAL ALERT (2/3): Battery draining to 1% AND auto-sending your WhatsApp voice notes to your mom! Press YES to abort!",
      "🔒 ACCESS DENIED (3/3): Nice try! Your 'No' license has expired. I deleted the button—now press YES before your screen turns into a brick! 🧱"
    ];

    noBtn.addEventListener('click', () => {
      if (noAttempts < 3) {
        document.body.classList.add('danger-mode');
        mainCard.classList.remove('shake');
        void mainCard.offsetWidth;
        mainCard.classList.add('shake');

        topIcon.textContent = "🚨";
        warningBox.style.display = "block";
        warningBox.textContent = threats[noAttempts];

        noAttempts++;
        yesScale += 0.24;
        yesBtn.style.transform = `scale(${yesScale})`;

        if (noAttempts === 3) {
          noBtn.style.display = "none";
        } else {
          noBtn.style.transform = `scale(${1 - noAttempts * 0.22})`;
        }
      }
    });

    yesBtn.addEventListener('click', () => {
      document.body.classList.remove('danger-mode');
      warningBox.style.display = "none";
      btnGroup.style.display = "none";

      topIcon.textContent = "💐";
      titleText.textContent = "I Knew It, Phina! ❤️";
      messageText.innerHTML = `
        Phone saved & selfies spared! Sending all my love and a garden of flowers straight to your screen.<br><br>
        <strong>Enjoy your study babygirl😍, can't wait to see you! 🌹✨</strong>
      `;

      startFlowerShower();
    });

    function startFlowerShower() {
      const items = ["🌹", "🌸", "💐", "🌺", "🌷", "❤️", "💖", "✨"];
      setInterval(() => {
        const flower = document.createElement("div");
        flower.classList.add("flower");
        flower.textContent = items[Math.floor(Math.random() * items.length)];
        flower.style.left = Math.random() * 100 + "vw";
        flower.style.fontSize = (Math.random() * 1.4 + 1.4) + "rem";
        flower.style.animationDuration = (Math.random() * 2.5 + 2.5) + "s";
        document.body.appendChild(flower);

        setTimeout(() => {
          flower.remove();
        }, 5000);
      }, 150);
    }
  </script>
</body>
</html>
